<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 LED Control</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      color-scheme: dark;
      --bg: #061018;
      --panel: rgba(12, 29, 42, 0.78);
      --panel-border: rgba(118, 211, 255, 0.2);
      --text: #e8f7ff;
      --muted: #7d9baa;
      --cyan: #42ddff;
      --blue: #5278ff;
      --green: #47f0b0;
      --red: #ff6b83;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 24px;
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      background:
        radial-gradient(circle at 10% 10%, rgba(41, 150, 189, 0.18), transparent 32%),
        radial-gradient(circle at 90% 90%, rgba(67, 76, 211, 0.16), transparent 35%),
        var(--bg);
    }

    body::before {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      content: '';
      opacity: 0.28;
      background-image: linear-gradient(rgba(100, 196, 232, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100, 196, 232, 0.07) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 75%);
    }

    .box {
      width: min(100%, 480px);
      position: relative;
      padding: clamp(28px, 6vw, 52px);
      overflow: hidden;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42), inset 0 1px rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(22px);
      animation: rise-in 0.7s ease-out both;
    }

    .box::after {
      position: absolute;
      width: 180px;
      height: 180px;
      top: -120px;
      right: -80px;
      content: '';
      border: 1px solid rgba(66, 221, 255, 0.22);
      border-radius: 50%;
      box-shadow: 0 0 0 22px rgba(66, 221, 255, 0.03), 0 0 0 44px rgba(66, 221, 255, 0.02);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 22px;
      color: var(--cyan);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 7px;
      height: 7px;
      content: '';
      background: var(--cyan);
      border-radius: 50%;
      box-shadow: 0 0 14px var(--cyan);
    }

    h1 {
      max-width: 330px;
      margin: 0;
      font-size: clamp(30px, 7vw, 42px);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 16px 0 34px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    button {
      min-height: 58px;
      padding: 14px 16px;
      color: var(--text);
      font: 600 14px 'Space Grotesk', sans-serif;
      letter-spacing: 0.02em;
      border: 1px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    button:hover {
      transform: translateY(-3px);
    }

    button:active {
      transform: translateY(1px) scale(0.98);
    }

    .on {
      background: linear-gradient(135deg, rgba(71, 240, 176, 0.2), rgba(29, 172, 163, 0.12));
      border-color: rgba(71, 240, 176, 0.58);
      box-shadow: 0 8px 22px rgba(71, 240, 176, 0.11);
    }

    .on:hover {
      box-shadow: 0 12px 28px rgba(71, 240, 176, 0.25);
    }

    .off {
      background: linear-gradient(135deg, rgba(255, 107, 131, 0.18), rgba(175, 65, 113, 0.1));
      border-color: rgba(255, 107, 131, 0.55);
      box-shadow: 0 8px 22px rgba(255, 107, 131, 0.1);
    }

    .off:hover {
      box-shadow: 0 12px 28px rgba(255, 107, 131, 0.24);
    }

    .status-panel {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 28px;
      padding: 16px;
      background: rgba(3, 13, 21, 0.42);
      border: 1px solid rgba(125, 155, 170, 0.15);
      border-radius: 12px;
    }

    .status-light {
      width: 12px;
      height: 12px;
      flex: 0 0 auto;
      background: var(--cyan);
      border: 3px solid rgba(66, 221, 255, 0.2);
      border-radius: 50%;
      box-shadow: 0 0 0 4px rgba(66, 221, 255, 0.06), 0 0 18px var(--cyan);
      animation: pulse 2.2s ease-in-out infinite;
    }

    #status {
      margin: 0;
      color: #cce4ee;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .connection-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding: 13px 16px;
      color: var(--muted);
      background: rgba(3, 13, 21, 0.28);
      border: 1px solid rgba(125, 155, 170, 0.12);
      border-radius: 12px;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
    }

    #connection-status {
      color: var(--cyan);
      font-size: 11px;
    }

    .footer-note {
      margin: 26px 0 0;
      color: #587381;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.08em;
      text-align: center;
      text-transform: uppercase;
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      50% { opacity: 0.65; box-shadow: 0 0 0 5px rgba(66, 221, 255, 0.04), 0 0 10px var(--cyan); }
    }

    @media (max-width: 380px) {
      body { padding: 14px; }
      .controls { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<div class="box">

  <div class="eyebrow">ESP32 // IoT node online</div>
  <h1>LED control<br>interface</h1>
  <p class="subtitle">Manage your connected light remotely through a secure Blynk Cloud link.</p>

  <div class="controls">
    <button class="on" onclick="setLED(1)">LED ON</button>
    <button class="off" onclick="setLED(0)">LED OFF</button>
  </div>

  <div class="status-panel">
    <span class="status-light" aria-hidden="true"></span>
    <p id="status">Status: Ready</p>
  </div>

  <div class="connection-status">
    <span>Hardware connection</span>
    <span id="connection-status">Checking...</span>
  </div>

  <p class="footer-note">Virtual pin V0 // remote control</p>

</div>

<script>

  // =========================
  // BLYNK SETTINGS
  // =========================

  const AUTH_TOKEN = "IMz1W97RnK2l9Y_cGsoBEzPGsKr1jQt-";

  // For Blynk Cloud:
  const BLYNK_SERVER = "https://blynk.cloud";


  // =========================
  // CONTROL LED
  // =========================

  async function setLED(value) {

    const status = document.getElementById("status");

    status.innerText = "Sending...";

    try {

      const response = await fetch(
        BLYNK_SERVER +
        "/external/api/update?token=" +
        encodeURIComponent(AUTH_TOKEN) +
        "&V0=" +
        value
      );

      if (response.ok) {

        if (value === 1) {
          status.innerText = "Status: LED ON 🟢";
        } else {
          status.innerText = "Status: LED OFF 🔴";
        }

      } else {

        status.innerText =
          "Error: Blynk returned " + response.status;

      }

    } catch (error) {

      status.innerText =
        "Connection error";

      console.error(error);

    }

  }

  async function checkHardwareConnection() {

    const connectionStatus = document.getElementById("connection-status");

    try {

      const response = await fetch(
        BLYNK_SERVER +
        "/external/api/isHardwareConnected?token=" +
        encodeURIComponent(AUTH_TOKEN)
      );

      const isConnected = response.ok &&
        (await response.text()).trim().toLowerCase() === "true";

      if (isConnected) {
        connectionStatus.innerText = "🟢 ESP32 ONLINE";
      } else {
        connectionStatus.innerText = "🔴 ESP32 OFFLINE";
      }

    } catch (error) {

      connectionStatus.innerText = "🔴 ESP32 OFFLINE";
      console.error(error);

    }

  }

  checkHardwareConnection();
  setInterval(checkHardwareConnection, 5000);

</script>

</body>
</html>
